<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Campus Connect</title>

    <link rel="stylesheet" href="style.css">
    <script src="events.js" defer></script>
</head>

<body>

    <!-- Navigation Bar -->
    <header>
        <nav class="navbar">

            <h2 class="brand">Campus Connect</h2>

            <div class="nav-links">
                <a href="index.html">Event</a>
                <a href="register.html">Register</a>
                <a href="dashboard.html">Dashboard</a>
            </div>

        </nav>
    </header>


    <!-- Main Section -->
    <main>

        <!-- Welcome Section -->
        <section class="hero">

            <h1>Find Your Next Campus experience</h1>

            <p>
                Find and register for upcoming college fests,
                workshops, seminars and competitions.
            </p>

            <a href="#events" class="primary-button">
                Explore Events
            </a>

        </section>


        <!-- Events Section -->
        <section class="events-section" id="events">

            <div class="section-heading">
                
                <h2>Upcoming Events</h2>

                <div class="filter-control">

                    <label for="categoryFilter">
                        Select Category:
                    </label>

                    <select id="categoryFilter">

                        <option value="all">All Events</option>
                        <option value="Fest">Fests</option>
                        <option value="Workshop">Workshops</option>
                        <option value="Seminar">Seminars</option>
                        <option value="Competition">Competitions</option>

                    </select>

                </div>

            </div>


            <!-- Events will be displayed here -->
            <div class="event-grid" id="eventList">

                <p class="empty-state">
                    Campus events will appear here soon.
                </p>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer>
        <center>
            <p>Campus Event Management Portal | 2026</p>
        </center>
    </footer>

</body>

</html>
