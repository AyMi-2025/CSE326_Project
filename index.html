<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Event Management & Registration Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="main-header">
        <h1>Campus Event Management & Registration Portal</h1>
        <p>Explore and register for upcoming college fests, workshops, and seminars.</p>
    </header>

    <main class="container">
        <section class="welcome-box">
            <h2>Welcome to the Portal</h2>
            <p>System status: <span id="status-text">Loading upcoming events...</span></p>
            <button id="explore-btn" class="btn">View Events</button>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
